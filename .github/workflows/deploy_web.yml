name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installation de Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # 3. Installation des dépendances
      - name: Install dependencies
        run: flutter pub get

      # 4. Build Flutter Web en release
      #    --base-href injecte directement la bonne valeur dans index.html
      - name: Build Flutter Web
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/$REPO_NAME/"

      # 5. Copie build/web/ → docs/
      - name: Copy build to docs/
        run: |
          rm -rf docs
          cp -r build/web docs

      # 6. Commit et push de docs/
      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "ci: deploy Flutter Web [$(date +'%Y-%m-%d %H:%M')]"
          git push

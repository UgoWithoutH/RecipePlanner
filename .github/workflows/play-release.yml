name: Play Store Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  play-store-release:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # Download latest AAB artifact from build workflow
      # =========================================================
      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          workflow_conclusion: success
          name: app-release-aab

      - name: Show downloaded files
        run: find . -type f

      # =========================================================
      # Setup Ruby for Fastlane
      # =========================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Fastlane
        run: gem install fastlane -NV

      # =========================================================
      # Create Google service account file
      # =========================================================
      - name: Create service account file
        run: echo '${{ secrets.ANDROID_PUBLISH_SERVICE_ACCOUNT }}' > service-account.json

      # =========================================================
      # Upload to Google Play (Closed Testing Alpha)
      # =========================================================
      - name: Upload to Google Play
        run: |
          fastlane supply \
            --json_key service-account.json \
            --package_name "${{ secrets.PLAY_STORE_PACKAGE_NAME }}" \
            --aab app-release.aab \
            --track alpha \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
